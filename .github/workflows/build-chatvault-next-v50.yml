name: Build ChatVault Next v5.0

on:
  push:
    branches:
      - build-chatvault-next-v50-20260831
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Reconstruct v3.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat chatvault_v31/chunks/payload_* > /tmp/chatvault_v31_payload.b64
          test "$(wc -c < /tmp/chatvault_v31_payload.b64)" -eq 55880
          base64 -d /tmp/chatvault_v31_payload.b64 > /tmp/chatvault_v31_payload.zip
          echo 'ca114021fadbdaac60762f200e7bfc3a5f1899a81bfd8f4ccee9c9cbfe055ce5  /tmp/chatvault_v31_payload.zip' | sha256sum -c -
          unzip -t /tmp/chatvault_v31_payload.zip

      - name: Create ChatVault Next project and signing key
        shell: bash
        run: |
          set -euo pipefail
          rm -rf chatvault_next/project
          mkdir -p chatvault_next/project
          cd chatvault_next/project
          flutter create --platforms=android --org com.mographiccode --project-name chatvault .
          unzip -qo /tmp/chatvault_v31_payload.zip -d .

          patch -p1 < ../../chatvault_v40/patch_db.diff
          patch -p1 < ../../chatvault_v40/patch_activity.diff
          patch -p1 < ../../chatvault_v40/patch_ui.diff
          patch -p1 < ../../chatvault_v40/patch_pubspec.diff

          patch -p1 < ../../chatvault_v41/patch_db.diff
          patch -p1 < ../../chatvault_v41/patch_activity.diff
          patch -p1 < ../../chatvault_v41/patch_ui.diff
          patch -p1 < ../../chatvault_v41/patch_manifest.diff
          patch -p1 < ../../chatvault_v41/patch_pubspec.diff

          sed -i 's/version: 4.1.0+11/version: 5.0.0+1/' pubspec.yaml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com.mographiccode.chatvault"/applicationId = "com.mographiccode.chatvault.next"/' android/app/build.gradle.kts
          sed -i 's/android:label="ChatVault"/android:label="ChatVault Next"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/if (!mounted || matches.isEmpty) return;/if (!context.mounted || matches.isEmpty) return;/' lib/main.dart

          SIGN_PASS=$(openssl rand -hex 24)
          echo "::add-mask::$SIGN_PASS"
          echo "CHATVAULT_SIGN_PASS=$SIGN_PASS" >> "$GITHUB_ENV"

          keytool -genkeypair -noprompt \
            -keystore android/app/chatvault-next-signing.jks \
            -storepass "$SIGN_PASS" \
            -keypass "$SIGN_PASS" \
            -alias chatvaultnext \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname 'CN=ChatVault Next, OU=Mobile Apps, O=MographicCode, L=Sanaa, ST=Sanaa, C=YE'

          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          needle = '    buildTypes {\n'
          block = '''    signingConfigs {
              getByName("debug") {
                  storeFile = file("chatvault-next-signing.jks")
                  storePassword = System.getenv("CHATVAULT_SIGN_PASS")
                  keyAlias = "chatvaultnext"
                  keyPassword = System.getenv("CHATVAULT_SIGN_PASS")
              }
          }

          '''
          if needle not in s:
              raise SystemExit('buildTypes block not found')
          p.write_text(s.replace(needle, block + needle, 1))
          PY

          grep -q 'applicationId = "com.mographiccode.chatvault.next"' android/app/build.gradle.kts
          grep -q 'storeFile = file("chatvault-next-signing.jks")' android/app/build.gradle.kts
          grep -q 'version: 5.0.0+1' pubspec.yaml
          grep -q 'DATABASE_VERSION = 4' android/app/src/main/kotlin/com/mographiccode/chatvault/LocalMessageDatabase.kt
          grep -q 'com.mographiccode.chatvault.v31' android/app/src/main/kotlin/com/mographiccode/chatvault/MainActivity.kt
          grep -q 'importLegacyDatabase' android/app/src/main/kotlin/com/mographiccode/chatvault/LocalMessageDatabase.kt
          grep -q 'pickAndShareFile' android/app/src/main/kotlin/com/mographiccode/chatvault/MainActivity.kt
          grep -q 'نسخ الرسالة' lib/main.dart

      - name: Get dependencies
        working-directory: chatvault_next/project
        run: flutter pub get

      - name: Static analysis
        working-directory: chatvault_next/project
        run: flutter analyze lib test

      - name: Widget tests
        working-directory: chatvault_next/project
        run: flutter test

      - name: Build Gradle-signed release APK
        working-directory: chatvault_next/project
        run: flutter build apk --release

      - name: Verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK='chatvault_next/project/build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"
          APT=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZA=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          "$APT" verify --verbose --print-certs "$APK" | tee chatvault_next/apksigner-verify.txt
          "$ZA" -c -P 16 -v 4 "$APK" > chatvault_next/zipalign-verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' chatvault_next/apksigner-verify.txt
          grep -q 'Verification successful' chatvault_next/zipalign-verify.txt
          unzip -t "$APK" >/tmp/apk-unzip-test.txt
          cp "$APK" chatvault_next/ChatVault-Next-v5.0.0.apk
          sha256sum chatvault_next/ChatVault-Next-v5.0.0.apk | tee chatvault_next/ChatVault-Next-v5.0.0.sha256
          keytool -list -v \
            -keystore chatvault_next/project/android/app/chatvault-next-signing.jks \
            -storepass "$CHATVAULT_SIGN_PASS" -alias chatvaultnext \
            | grep -E 'SHA256:|Valid from:' > chatvault_next/signing-certificate.txt
          ls -lh chatvault_next/ChatVault-Next-v5.0.0.apk

      - name: Encrypt signing key backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chatvault_next/signing_export
          cp chatvault_next/project/android/app/chatvault-next-signing.jks chatvault_next/signing_export/
          printf 'Package ID: com.mographiccode.chatvault.next\nAlias: chatvaultnext\nPassword: %s\n' "$CHATVAULT_SIGN_PASS" > chatvault_next/signing_export/signing-info.txt
          cp chatvault_next/signing-certificate.txt chatvault_next/signing_export/
          tar -C chatvault_next/signing_export -czf /tmp/chatvault-next-signing.tar.gz .

          cat > /tmp/export-public.pem <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAkt7xfmxEYMnRySHqj7V8
          yiwF+/an7zlqLWel2zZppOmai7G6mgaAv1YNmZEQjE2uTP8C+sHAkkHnp1rKUWUV
          PLWBK7RmXCAbIb1xqI3Wa2zfI/OELldjOObCHNbV6vK++nPrOkpdWrFIugPaFfBq
          gfC+80rumXMBfQH2dP10trs2LVl/kDCo3idYT0Uz7dD2uN1stZ2pRev5m6gYNcc7
          67aF2MHahz+0qL08ule+4kFCuVo1HkCiYuoyEf8/KU1Z4QLWKIR1EmCCac0H4N7J
          xTNMzVRlVNZyzHmx8/ste7Z/rFARuKcZyDwuWh330do2M1c8KIT8Yp7jS8wsJ3rw
          XqHgFxZy0lmGZGM0xJtRRFBMNa8vW/puSNkTfET2FVkq2gjDB/HsHSDgR5wh74ym
          4BIojbx86ESwLRi41dlgqGz/Udf+LD5EHDhx8kb0vQH32Ihhi71ArBpQFbJff/aq
          M7YMYzWmsiz4S8EyXpzqzsGwsc8Eyz8siJ99sYHldudY/uAfkPGcLrthdNSjfy5U
          EVcB2UvwZc+axDuOnwrvJ0mZ/G1wQSXLb1Jl0nyO/VR4M63bGUipSVBcBhqryH3E
          NT2kldQm0/G1Jv2wrNJaCbzPRD/Pnisxsq0S5NhBwhcDpZbTRfl75GzDzoJfOLih
          o0fGl5v+yzTyGg+IC+MS4V0CAwEAAQ==
          -----END PUBLIC KEY-----
          PUBKEY

          EXPORT_PASS=$(openssl rand -hex 32)
          echo "::add-mask::$EXPORT_PASS"
          export EXPORT_PASS
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in /tmp/chatvault-next-signing.tar.gz \
            -out chatvault_next/ChatVault-Next-signing-bundle.enc \
            -pass env:EXPORT_PASS
          printf '%s' "$EXPORT_PASS" | openssl pkeyutl -encrypt \
            -pubin -inkey /tmp/export-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out chatvault_next/ChatVault-Next-signing-pass.enc
          rm -rf chatvault_next/signing_export /tmp/chatvault-next-signing.tar.gz

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatVault-Next-v5.0.0-INSTALLABLE
          path: |
            chatvault_next/ChatVault-Next-v5.0.0.apk
            chatvault_next/ChatVault-Next-v5.0.0.sha256
            chatvault_next/apksigner-verify.txt
            chatvault_next/zipalign-verify.txt
            chatvault_next/signing-certificate.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload encrypted signing backup
        uses: actions/upload-artifact@v4
        with:
          name: ChatVault-Next-v5.0.0-SIGNING-ENCRYPTED
          path: |
            chatvault_next/ChatVault-Next-signing-bundle.enc
            chatvault_next/ChatVault-Next-signing-pass.enc
          if-no-files-found: error
          retention-days: 1
