name: WiFiGuard Android APK + Emulator
on:
  push:
    branches: [wifiguardai-ci-20260812]
    paths:
      - 'ci_android/**'
      - '.github/workflows/wifiguard_android.yml'
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Reconstruct exact project archive
        run: |
          set -euxo pipefail
          cat ci_android/zip.part0* | tr -d '\n\r' > /tmp/wifiguard.b64
          base64 -d /tmp/wifiguard.b64 > /tmp/WiFiGuardAI.zip
          unzip -t /tmp/WiFiGuardAI.zip
          mkdir -p /tmp/source
          unzip -q /tmp/WiFiGuardAI.zip -d /tmp/source
          test -f /tmp/source/lib/main.dart
          test -f /tmp/source/android/app/src/main/kotlin/com/example/wifiguardai/security/SecurityVpnService.kt

      - name: Create official Flutter Android scaffold and overlay application
        run: |
          set -euxo pipefail
          flutter --version
          flutter create --platforms=android --org com.example --project-name wifi_guard_ai /tmp/app
          rm -rf /tmp/app/lib /tmp/app/test
          cp -a /tmp/source/lib /tmp/app/lib
          cp -a /tmp/source/test /tmp/app/test
          cp ci_android/widget_test.dart /tmp/app/test/widget_test.dart
          cp /tmp/source/pubspec.yaml /tmp/app/pubspec.yaml
          cp /tmp/source/analysis_options.yaml /tmp/app/analysis_options.yaml
          rm -rf /tmp/app/android/app/src/main/kotlin
          cp -a /tmp/source/android/app/src/main/kotlin /tmp/app/android/app/src/main/kotlin
          cp /tmp/source/android/app/src/main/AndroidManifest.xml /tmp/app/android/app/src/main/AndroidManifest.xml
          mkdir -p /tmp/app/android/app/src/main/res/values /tmp/app/android/app/src/main/assets
          cp /tmp/source/android/app/src/main/res/values/styles.xml /tmp/app/android/app/src/main/res/values/styles.xml
          cp -a /tmp/source/android/app/src/main/assets/. /tmp/app/android/app/src/main/assets/
          sed -i 's/com\.example\.wifi_guard_ai/com.example.wifiguardai/g' /tmp/app/android/app/build.gradle.kts
          sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 23/' /tmp/app/android/app/build.gradle.kts
          printf '%s\n' '' 'android {' '    androidResources {' '        noCompress += "tflite"' '    }' '}' '' 'dependencies {' '    implementation("androidx.core:core-ktx:1.15.0")' '    implementation("com.google.android.gms:play-services-tflite-java:16.5.0")' '    implementation("com.google.android.gms:play-services-tflite-support:16.5.0")' '}' >> /tmp/app/android/app/build.gradle.kts
          cat /tmp/app/android/app/build.gradle.kts
          cd /tmp/app
          flutter pub get
          flutter analyze
          flutter test

      - name: Build debug APK
        working-directory: /tmp/app
        run: |
          set -euxo pipefail
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee /tmp/apk_sha256.txt

      - name: Kotlin parser smoke test
        run: |
          set -euxo pipefail
          kotlinc /tmp/source/android/app/src/main/kotlin/com/example/wifiguardai/security/DnsMessageParser.kt /tmp/source/android/app/src/main/kotlin/com/example/wifiguardai/security/IpDnsPacket.kt /tmp/source/tests/kotlin/ParserSmokeTest.kt -include-runtime -d /tmp/parser-test.jar
          java -jar /tmp/parser-test.jar | tee /tmp/parser_test.log

      - name: Prepare KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Emulator install + cold launch + crash scan
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euxo pipefail
            adb logcat -c
            adb install -r /tmp/app/build/app/outputs/flutter-apk/app-debug.apk
            adb shell am force-stop com.example.wifiguardai
            adb shell am start -W -n com.example.wifiguardai/.MainActivity | tee /tmp/am_start.txt
            sleep 8
            adb shell pidof com.example.wifiguardai | tee /tmp/app_pid.txt
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|com.example.wifiguardai' | head -30 | tee /tmp/activity_state.txt
            adb exec-out screencap -p > /tmp/android_dashboard.png
            adb logcat -d -v threadtime > /tmp/logcat_full.txt
            if grep -E 'FATAL EXCEPTION|Process: com\.example\.wifiguardai.*has died|AndroidRuntime.*com\.example\.wifiguardai' /tmp/logcat_full.txt; then exit 1; fi
            grep -E 'com\.example\.wifiguardai|flutter' /tmp/logcat_full.txt | tail -300 > /tmp/logcat_app.txt || true

      - name: Package tested project
        if: always()
        run: |
          if [ -d /tmp/app ]; then cd /tmp/app && zip -qr /tmp/WiFiGuardAI_Android_Scaffolded.zip . -x 'build/*' '.dart_tool/*' '.gradle/*'; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wifiguard-android-test-results
          if-no-files-found: warn
          path: |
            /tmp/app/build/app/outputs/flutter-apk/app-debug.apk
            /tmp/WiFiGuardAI_Android_Scaffolded.zip
            /tmp/android_dashboard.png
            /tmp/am_start.txt
            /tmp/app_pid.txt
            /tmp/activity_state.txt
            /tmp/logcat_app.txt
            /tmp/logcat_full.txt
            /tmp/apk_sha256.txt
            /tmp/parser_test.log
