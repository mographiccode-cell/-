name: Build ChatVault v3.1

on:
  push:
    branches:
      - build-chatvault-v31-20260830
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Verify and decode source payload
        shell: bash
        run: |
          set -euo pipefail
          cat chatvault_v31/chunks/payload_* > /tmp/chatvault_v31_payload.b64
          test "$(wc -c < /tmp/chatvault_v31_payload.b64)" -eq 55880
          base64 -d /tmp/chatvault_v31_payload.b64 > /tmp/chatvault_v31_payload.zip
          echo 'ca114021fadbdaac60762f200e7bfc3a5f1899a81bfd8f4ccee9c9cbfe055ce5  /tmp/chatvault_v31_payload.zip' | sha256sum -c -
          unzip -t /tmp/chatvault_v31_payload.zip

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf chatvault_v31/project
          mkdir -p chatvault_v31/project
          cd chatvault_v31/project
          flutter create --platforms=android --org com.mographiccode --project-name chatvault .
          unzip -qo /tmp/chatvault_v31_payload.zip -d .
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com.mographiccode.chatvault"/applicationId = "com.mographiccode.chatvault.v31"/' android/app/build.gradle.kts
          sed -i 's/android:label="ChatVault"/android:label="ChatVault 3.1"/' android/app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.mographiccode.chatvault.v31"' android/app/build.gradle.kts
          grep -q 'android.permission.READ_CONTACTS' android/app/src/main/AndroidManifest.xml
          grep -q 'com.mographiccode.chatvault/events' android/app/src/main/kotlin/com/mographiccode/chatvault/MainActivity.kt
          grep -q 'DATABASE_VERSION = 2' android/app/src/main/kotlin/com/mographiccode/chatvault/LocalMessageDatabase.kt
          grep -q 'FLAG_GROUP_SUMMARY' android/app/src/main/kotlin/com/mographiccode/chatvault/WhatsAppNotificationListener.kt

      - name: Get dependencies
        working-directory: chatvault_v31/project
        run: flutter pub get

      - name: Static analysis
        working-directory: chatvault_v31/project
        run: flutter analyze lib test

      - name: Widget tests
        working-directory: chatvault_v31/project
        run: flutter test

      - name: Build release APK
        working-directory: chatvault_v31/project
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='chatvault_v31/project/build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"
          unzip -t "$APK" >/tmp/apk-unzip-test.txt
          sha256sum "$APK" | tee chatvault_v31/ChatVault-v3.1.0-ci.sha256
          cp "$APK" chatvault_v31/ChatVault-v3.1.0-ci.apk
          file chatvault_v31/ChatVault-v3.1.0-ci.apk
          ls -lh chatvault_v31/ChatVault-v3.1.0-ci.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatVault-v3.1.0-CI-APK
          path: |
            chatvault_v31/ChatVault-v3.1.0-ci.apk
            chatvault_v31/ChatVault-v3.1.0-ci.sha256
          if-no-files-found: error
          retention-days: 7
