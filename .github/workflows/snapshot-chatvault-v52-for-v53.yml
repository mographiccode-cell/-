name: Snapshot ChatVault v5.2 source for v5.3

on:
  push:
    branches:
      - build-chatvault-next-v53-20260901
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Reconstruct exact v5.2 source
        shell: bash
        run: |
          set -euo pipefail
          cat chatvault_v31/chunks/payload_* > /tmp/v31.b64
          test "$(wc -c < /tmp/v31.b64)" -eq 55880
          base64 -d /tmp/v31.b64 > /tmp/v31.zip
          echo 'ca114021fadbdaac60762f200e7bfc3a5f1899a81bfd8f4ccee9c9cbfe055ce5  /tmp/v31.zip' | sha256sum -c -
          unzip -t /tmp/v31.zip >/dev/null

          rm -rf chatvault_v53/source_v52
          mkdir -p chatvault_v53/source_v52
          cd chatvault_v53/source_v52
          flutter create --platforms=android --org com.mographiccode --project-name chatvault .
          unzip -qo /tmp/v31.zip -d .

          patch -p1 < ../../chatvault_v40/patch_db.diff
          patch -p1 < ../../chatvault_v40/patch_activity.diff
          patch -p1 < ../../chatvault_v40/patch_ui.diff
          patch -p1 < ../../chatvault_v40/patch_pubspec.diff

          patch -p1 < ../../chatvault_v41/patch_db.diff
          patch -p1 < ../../chatvault_v41/patch_activity.diff
          patch -p1 < ../../chatvault_v41/patch_ui.diff
          patch -p1 < ../../chatvault_v41/patch_manifest.diff
          patch -p1 < ../../chatvault_v41/patch_pubspec.diff

          cat ../../chatvault_v51/ui_parts/part_* > /tmp/v51_ui.diff
          cat ../../chatvault_v51/gemini_parts/part_* > android/app/src/main/kotlin/com/mographiccode/chatvault/GeminiManager.kt
          patch -p1 < ../../chatvault_v51/patch_activity.diff
          patch -p1 < /tmp/v51_ui.diff
          patch -p1 < ../../chatvault_v51/patch_manifest.diff
          patch -p1 < ../../chatvault_v51/patch_pubspec.diff

          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace('if (!mounted || matches.isEmpty) return;', 'if (!context.mounted || matches.isEmpty) return;')
          s = s.replace(
              "Flexible(child: SingleChildScrollView(child: SelectionArea(child: Text(report.isEmpty ? 'لم يرجع Gemini تقريرًا نصيًا.' : report, style: const TextStyle(height: 1.55, fontSize: 13)))),",
              "Flexible(child: SingleChildScrollView(child: SelectionArea(child: Text(report.isEmpty ? 'لم يرجع Gemini تقريرًا نصيًا.' : report, style: const TextStyle(height: 1.55, fontSize: 13))))),",
          )
          start = s.find('  Future<void> _requestContacts() async {')
          end = s.find('  Future<void> _importLegacyRoot()', start)
          if start >= 0 and end > start:
              s = s[:start] + s[end:]
          s = s.replace('DropdownButtonFormField<String>(\n                        value:', 'DropdownButtonFormField<String>(\n                        initialValue:')
          s = s.replace(
              "                                Radio<String>(value: id, groupValue: _settings['activeKeyId']?.toString(), onChanged: _working ? null : (v) { if (v != null) _setActive(v); }),",
              "                                // ignore: deprecated_member_use\n                                Radio<String>(value: id, groupValue: _settings['activeKeyId']?.toString(), onChanged: _working ? null : (v) { if (v != null) _setActive(v); }),",
          )
          p.write_text(s)

          g = Path('android/app/src/main/kotlin/com/mographiccode/chatvault/GeminiManager.kt')
          gs = g.read_text()
          gs = gs.replace(
              '        connection.setRequestProperty("Accept", "application/json")\n',
              '        connection.setRequestProperty("Accept", "application/json")\n        if (url.contains("/interactions")) connection.setRequestProperty("Api-Revision", "2026-05-20")\n',
          )
          g.write_text(gs)
          PY

          cat ../../chatvault_v52/b64_chunks/chunk_* > /tmp/v52.b64
          test "$(wc -c < /tmp/v52.b64)" -eq 42068
          echo '7167bde1157506ebcd5379f05003501cff6a1686e5750446b0ba2a49a65b160b  /tmp/v52.b64' | sha256sum -c -
          base64 -d /tmp/v52.b64 > /tmp/v52.patch
          echo '3f097fb59091aa4669b242a77dddba44ab9ccb500c58101a8c928648f566da55  /tmp/v52.patch' | sha256sum -c -
          patch -p1 < /tmp/v52.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace(
              "if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('تمت إضافة $count ملف وسائط جديد.')));",
              "if (context.mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('تمت إضافة $count ملف وسائط جديد.')));",
          )
          s = s.replace(
              "if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('تم تحديث $count سجل.')));",
              "if (context.mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('تم تحديث $count سجل.')));",
          )
          p.write_text(s)
          PY

          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com.mographiccode.chatvault"/applicationId = "com.mographiccode.chatvault.next"/' android/app/build.gradle.kts
          sed -i '/signingConfig = signingConfigs.getByName("debug")/d' android/app/build.gradle.kts

          grep -q 'applicationId = "com.mographiccode.chatvault.next"' android/app/build.gradle.kts
          grep -q 'version: 5.2.0+4' pubspec.yaml

      - name: Package source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -C chatvault_v53 -czf chatvault_v53/ChatVault-v5.2-source-snapshot.tar.gz source_v52
          sha256sum chatvault_v53/ChatVault-v5.2-source-snapshot.tar.gz > chatvault_v53/ChatVault-v5.2-source-snapshot.sha256

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ChatVault-v5.2-SOURCE-SNAPSHOT
          path: |
            chatvault_v53/ChatVault-v5.2-source-snapshot.tar.gz
            chatvault_v53/ChatVault-v5.2-source-snapshot.sha256
          if-no-files-found: error
          retention-days: 7
