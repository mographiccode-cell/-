name: WiFiGuard VPN Permission Flow
on:
  push:
    branches: [wifiguardai-ci-20260812]
    paths:
      - '.github/workflows/wifiguard_vpn_permission.yml'
  workflow_dispatch:

jobs:
  vpn-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wifiguard-android-test-results
          path: /tmp/prior
          github-token: ${{ github.token }}
          run-id: 31611296693
      - name: Prepare KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Exercise Start Monitoring -> VPN permission
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            adb logcat -c
            adb install -r /tmp/prior/app/build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -W -n com.example.wifiguardai/.MainActivity >/tmp/start.txt
            sleep 5
            adb shell input tap 540 1275
            sleep 3
            adb shell uiautomator dump /sdcard/vpn_permission.xml >/dev/null 2>&1
            adb pull /sdcard/vpn_permission.xml /tmp/vpn_permission.xml >/dev/null
            adb exec-out screencap -p > /tmp/vpn_permission.png
            adb logcat -d -v threadtime > /tmp/vpn_logcat.txt
            ! grep -Eq 'FATAL EXCEPTION|Process: com\.example\.wifiguardai.*has died|AndroidRuntime.*com\.example\.wifiguardai' /tmp/vpn_logcat.txt
            grep -Eq 'VPN|vpn|Connection request|WiFi Guard AI|Cancel|OK|Allow|السماح|إلغاء' /tmp/vpn_permission.xml
            echo 'VPN_PERMISSION_FLOW=PASS' > /tmp/vpn_result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wifiguard-vpn-permission-results
          path: |
            /tmp/vpn_permission.xml
            /tmp/vpn_permission.png
            /tmp/vpn_logcat.txt
            /tmp/vpn_result.txt
