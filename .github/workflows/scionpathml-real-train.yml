name: ScionPathML Real Training

on:
  push:
    branches:
      - scionpathml-training-20260919
    paths:
      - "scion_train.py"
      - ".github/workflows/scionpathml-real-train.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn joblib

      - name: Train on official ScionPathML raw data
        run: python scion_train.py

      - name: Show outputs
        run: |
          ls -lh training-output
          cat training-output/model_status.json
          cat training-output/training_metrics.json

      - name: Upload training artifact
        uses: actions/upload-artifact@v4
        with:
          name: scionpathml-trained-model
          path: training-output/
          retention-days: 7

      - name: Commit compact outputs back to training branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training-output/
          git commit -m "Add real ScionPathML trained model outputs" || exit 0
          git push
