name: Build ProjectDesk Recovery v1.2

on:
  pull_request:
    branches:
      - main
    paths:
      - 'projectdesk-recovery-v12/**'
      - '.github/workflows/projectdesk-recovery-v12.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools and SDK 35
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
          rm -rf /tmp/cmdtools "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p /tmp/cmdtools "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          gradle -p projectdesk-recovery-v12 clean :app:assembleDebug --no-daemon --stacktrace
          mkdir -p projectdesk-recovery-v12/dist
          cp projectdesk-recovery-v12/app/build/outputs/apk/debug/app-debug.apk \
             projectdesk-recovery-v12/dist/ProjectDesk-Recovery-v1.2.0-Fixed.apk

      - name: Verify APK exists
        run: |
          test -s projectdesk-recovery-v12/dist/ProjectDesk-Recovery-v1.2.0-Fixed.apk
          ls -lh projectdesk-recovery-v12/dist/ProjectDesk-Recovery-v1.2.0-Fixed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectDesk-Recovery-v1.2.0-Fixed
          path: projectdesk-recovery-v12/dist/ProjectDesk-Recovery-v1.2.0-Fixed.apk
          if-no-files-found: error
          retention-days: 14
