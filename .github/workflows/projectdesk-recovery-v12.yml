name: Build ProjectDesk Recovery v1.2

on:
  push:
    branches:
      - projectdesk-recovery-v12
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          gradle -p projectdesk-recovery-v12 clean :app:assembleDebug --no-daemon --stacktrace
          mkdir -p projectdesk-recovery-v12/dist
          cp projectdesk-recovery-v12/app/build/outputs/apk/debug/app-debug.apk \
             projectdesk-recovery-v12/dist/ProjectDesk-Recovery-v1.2.0-Fixed.apk

      - name: Verify APK exists
        run: |
          test -s projectdesk-recovery-v12/dist/ProjectDesk-Recovery-v1.2.0-Fixed.apk
          ls -lh projectdesk-recovery-v12/dist/ProjectDesk-Recovery-v1.2.0-Fixed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectDesk-Recovery-v1.2.0-Fixed
          path: projectdesk-recovery-v12/dist/ProjectDesk-Recovery-v1.2.0-Fixed.apk
          if-no-files-found: error
          retention-days: 14
